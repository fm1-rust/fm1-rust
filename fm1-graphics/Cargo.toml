[package]
name = "fm1-graphics"
version = "0.2.0-rc.1"
edition = "2024"
description = "Allocation-free text and waveform rendering for the M-VAVE FM-1"
license = "MIT"
repository = "https://github.com/fm1-rust/fm1-rust"
keywords = ["fm1", "graphics", "rgb565"]
categories = ["embedded", "graphics", "no-std"]

[dependencies]
embedded-graphics-core = "0.4"
embedded-graphics = { version = "0.8.2", optional = true }
fm1.workspace = true

[features]
bsp-display = ["embedded-graphics", "fm1/embedded-graphics"]
embedded-graphics = ["dep:embedded-graphics"]
async-display = ["fm1/async-display"]

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
