[workspace]
resolver = "3"
members = [
    "fm1",
    "fm1-audio",
    "fm1-cli",
    "fm1-controls",
    "fm1-graphics",
    "fm1-rticx",
    "fm1-usb",
    "rticx-pi32v2",
    "rticx-pi32v2-macro"
]
# Keep the default firmware workspace build independent of the host MIDI stack.
default-members = [
    "fm1",
    "fm1-audio",
    "fm1-controls",
    "fm1-graphics",
    "fm1-rticx",
    "rticx-pi32v2",
    "rticx-pi32v2-macro",
]

[patch.crates-io]
fm1 = { path = "fm1" }
fm1-audio = { path = "fm1-audio" }
fm1-controls = { path = "fm1-controls" }
fm1-graphics = { path = "fm1-graphics" }
fm1-usb = { path = "fm1-usb" }
rticx-pi32v2 = { path = "rticx-pi32v2" }
rticx-pi32v2-macro = { path = "rticx-pi32v2-macro" }

[workspace.lints.clippy]
arithmetic_side_effects = "warn"
cast_lossless = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_precision_loss = "warn"
cast_sign_loss = "warn"
manual_assert = "warn"
map_unwrap_or = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
mod_module_files = "warn"
must_use_candidate = "warn"
panic = "warn"
std_instead_of_alloc = "warn"
std_instead_of_core = "warn"
unwrap_in_result = "warn"
unwrap_used = "warn"

[workspace.lints.rust]
missing_copy_implementations = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[profile.firmware]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
