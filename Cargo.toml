[workspace]
resolver = "3"
members = [
    "fm1",
    "fm1-assets",
    "fm1-audio",
    "fm1-cli",
    "fm1-controls",
    "fm1-graphics",
    "fm1-rticx",
    "fm1-usb",
    "rticx-pi32v2",
    "rticx-pi32v2-macro"
]
# Keep the default firmware workspace build independent of the host MIDI stack.
default-members = [
    "fm1",
    "fm1-assets",
    "fm1-audio",
    "fm1-controls",
    "fm1-graphics",
    "fm1-rticx",
    "rticx-pi32v2",
    "rticx-pi32v2-macro",
]

[workspace.package]
version = "0.2.0-rc.0"

[workspace.dependencies]
fm1 = { version = "0.2", path = "fm1" }
fm1-audio = { version = "0.2.1", path = "fm1-audio", default-features = false }
fm1-controls = { version = "0.2", path = "fm1-controls" }
fm1-graphics = { version = "0.2", path = "fm1-graphics" }
fm1-usb = { version = "0.2.0-rc.0", path = "fm1-usb" }
rticx-pi32v2 = { version = "0.2", path = "rticx-pi32v2" }
rticx-pi32v2-macro = { version = "0.2", path = "rticx-pi32v2-macro" }

[workspace.lints.clippy]
arithmetic_side_effects = "warn"
cast_lossless = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_precision_loss = "warn"
cast_sign_loss = "warn"
manual_assert = "warn"
map_unwrap_or = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
missing_safety_doc = "warn"
mod_module_files = "warn"
must_use_candidate = "warn"
panic = "warn"
std_instead_of_alloc = "warn"
std_instead_of_core = "warn"
undocumented_unsafe_blocks = "warn"
unwrap_in_result = "warn"
unwrap_used = "warn"

[workspace.lints.rust]
missing_copy_implementations = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "deny"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[profile.firmware]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
