[package]
name = "rticx-pi32v2"
version = "0.0.0"
edition = "2024"
description = "RTICX for CPU0 of the JieLi AC791N"
license = "MIT"
repository = "https://github.com/fm1-rust/fm1-rust"

[dependencies]
rticx-async = "0.2"
rticx-pi32v2-macro = { version = "0.0.0", path = "rticx-macro" }

[target.'cfg(target_arch = "pi32v2")'.dependencies]
critical-section = { version = "1", features = ["restore-state-u32"] }
heapless = "0.9"

[target.'cfg(not(target_os = "none"))'.dev-dependencies]
critical-section = { version = "1", features = ["std"] }
heapless = "0.9"

[build-dependencies]
cc = "1"

[lints]
workspace = true
