[package]
name = "rticx-pi32v2"
version.workspace = true
edition = "2024"
description = "RTICX for CPU0 of the JieLi AC791N"
license = "MIT"
repository = "https://github.com/fm1-rust/fm1-rust"
keywords = ["pi32v2", "rticx"]
categories = ["embedded", "hardware-support", "no-std"]

# Compile the shared layout fixture with the real target backend in CI.
[[example]]
name = "shared-layout"
path = "tests/ui/shared_layout.rs"
crate-type = ["rlib"]

[[example]]
name = "interrupt-handoffs"
path = "tests/ui/interrupt_handoffs.rs"
crate-type = ["rlib"]

[dependencies]
rtic-sync = { version = "1.6.1", default-features = false }
portable-atomic = { version = "1", default-features = false }
rticx-pi32v2-macro.workspace = true

[target.'cfg(target_arch = "pi32v2")'.dependencies]
critical-section = { version = "1", features = ["restore-state-u32"] }
heapless = "0.9"

[target.'cfg(not(target_os = "none"))'.dev-dependencies]
critical-section = { version = "1", features = ["std"] }
heapless = "0.9"

[build-dependencies]
cc = "1"

[lints]
workspace = true
