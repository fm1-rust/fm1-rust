name: Workspace

on:
  pull_request:
    paths-ignore:
      - README.md
  push:
    branches: main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  cargo-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --workspace --locked

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          components: clippy
      - run: cargo clippy --workspace --all-features --lib --bins --tests -- -Dwarnings

  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check

  semver-checks:
    runs-on: ubuntu-24.04
    env:
      RUSTUP_TOOLCHAIN: 1.100.0
      # v0.51.0 skips proc-macro crates. This revision includes upstream PR #1753.
      SEMVER_CHECKS_REV: 54303a8456298c66b22d3cbabee7ffd85ea76a1e
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # same runtime as v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --no-self-update
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: checker
        with:
          path: ~/.cargo/bin/cargo-semver-checks
          key: cargo-semver-checks-ubuntu-24.04-${{ runner.arch }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ env.SEMVER_CHECKS_REV }}
      - name: Install cargo-semver-checks
        if: steps.checker.outputs.cache-hit != 'true'
        run: |
          cargo install --locked --git https://github.com/obi1kenobi/cargo-semver-checks \
            --rev "$SEMVER_CHECKS_REV" cargo-semver-checks
      # fm1-rticx, fm1-audio, fm1-controls and fm1-graphics have no release on crates.io to compare against yet.
      - run: cargo semver-checks --workspace --exclude fm1-rticx --exclude fm1-audio --exclude fm1-controls --exclude fm1-graphics --all-features

  typos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: crate-ci/typos@v1
