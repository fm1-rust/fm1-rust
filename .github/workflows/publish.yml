name: Publish to crates.io

on:
  push:
    tags:
      - 'fm1/v*'

permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify package
    if: github.event.created
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # same runtime as v7.0.1
        with:
          persist-credentials: false

      - name: Verify the tagged workspace package
        shell: bash
        run: |
          package=$(cargo metadata --no-deps --format-version 1 |
            jq -er --arg tag "$GITHUB_REF_NAME" '
              first(.packages[] | select("\(.name)/v\(.version)" == $tag) | .name)
                // error("no workspace package matches tag \($tag)")
            ')
          cargo publish --dry-run --locked --registry crates-io --package "$package"

  firmware:
    name: Check FM-1 firmware
    needs: verify
    permissions:
      contents: read
    uses: ./.github/workflows/fm1.yml

  publish:
    name: Publish package
    needs: firmware
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      contents: read
      id-token: write # Exchange a GitHub OIDC token for a crates.io publishing token.
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # same runtime as v7.0.1
        with:
          persist-credentials: false

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@dc10531605597d48d51c6d1005a2b3861698940b # same runtime as v1.0.6

      - name: Publish the tagged package
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        # The host and pi32v2 jobs already built the package at this commit.
        run: cargo publish --locked --no-verify --registry crates-io --package "${GITHUB_REF_NAME%%/*}"
