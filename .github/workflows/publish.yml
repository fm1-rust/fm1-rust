name: Publish to crates.io

on:
  push:
    tags:
      - 'fm1/v*'
      - 'fm1-audio/v*'
      - 'fm1-cli/v*'
      - 'fm1-controls/v*'
      - 'fm1-graphics/v*'
      - 'fm1-rticx/v*'
      - 'fm1-usb/v*'
      - 'rticx-pi32v2-macro/v*'
      - 'rticx-pi32v2/v*'

permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify package
    if: github.event.created
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      package: ${{ steps.verify.outputs.package }}
      host: ${{ steps.verify.outputs.host }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # same runtime as v7.0.1
        with:
          persist-credentials: false

      - name: Verify the tagged workspace package
        id: verify
        shell: bash
        run: |
          package=$(cargo metadata --no-deps --format-version 1 |
            jq -er --arg tag "$GITHUB_REF_NAME" '
              first(.packages[] | select("\(.name)/v\(.version)" == $tag) | .name)
                // error("no workspace package matches tag \($tag)")
            ')
          case "$package" in
            fm1-cli|fm1-usb)
              sudo apt-get update
              sudo apt-get install -y libasound2-dev
              echo 'host=true' >> "$GITHUB_OUTPUT"
              ;;
          esac
          cargo test --locked --all-features --package "$package"
          cargo publish --dry-run --locked --registry crates-io --package "$package"
          echo "package=$package" >> "$GITHUB_OUTPUT"

  firmware:
    name: Check FM-1 firmware
    needs: verify
    if: needs.verify.outputs.host != 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/pi32v2-firmware.yml
    with:
      package: ${{ needs.verify.outputs.package == 'fm1' && 'fm1' || 'fm1-rticx' }}
      archive: ${{ needs.verify.outputs.package }}

  publish:
    name: Publish package
    needs: [verify, firmware]
    if: >-
      ${{ !cancelled() && needs.verify.result == 'success' &&
          (needs.firmware.result == 'success' ||
           (needs.verify.outputs.host == 'true' && needs.firmware.result == 'skipped')) }}
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      contents: read
      id-token: write # Exchange a GitHub OIDC token for a crates.io publishing token.
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # same runtime as v7.0.1
        with:
          persist-credentials: false

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@dc10531605597d48d51c6d1005a2b3861698940b # same runtime as v1.0.6

      - name: Publish the tagged package
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          PACKAGE: ${{ needs.verify.outputs.package }}
        run: cargo publish --locked --no-verify --registry crates-io --package "$PACKAGE"
