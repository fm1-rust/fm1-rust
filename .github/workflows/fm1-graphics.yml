name: fm1-graphics

on:
  pull_request:
    paths: &fm1-graphics-paths
      - 'fm1-graphics/**'
      - 'fm1/**'
      - Cargo.toml
      - Cargo.lock
      - '.cargo/**'
      - .github/workflows/fm1-graphics.yml
  push:
    branches: [main]
    paths: *fm1-graphics-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# fm1-rticx.yml cross-builds the controls, piano and waveform examples on graphics changes.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # same runtime as v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --no-self-update
      - run: cargo +stable test -p fm1-graphics --all-features --locked
