name: fm1-cli

on:
  pull_request:
    paths: &host-paths
      - 'fm1-cli/**'
      - 'fm1-usb/**'
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/fm1-cli.yml
  push:
    branches: [main]
    paths: *host-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest] # TODO(tarcieri): test `macos-latest` when runners are more reliable
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # same runtime as v7.0.1
        with:
          persist-credentials: false
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: rustup toolchain install stable --profile minimal --no-self-update
      - run: cargo +stable test --locked -p fm1-cli
      - run: cargo +stable run --locked -p fm1-cli --bin fm1 -- --version
