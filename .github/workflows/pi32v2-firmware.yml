name: pi32v2 firmware

on:
  workflow_call:
    inputs:
      package:
        description: Workspace package containing the FM-1 firmware examples
        type: string
        required: true
      archive:
        description: Tagged crate to verify against its registry dependencies
        type: string

permissions:
  contents: read

jobs:
  firmware:
    uses: ./.github/workflows/pi32v2-build.yml
    with:
      script: .github/scripts/build-firmware.sh
      args: |
        ${{ inputs.package }}
        ${{ inputs.archive }}
      artifact-name: ${{ inputs.package }}-firmware
      artifact-path: target/firmware/*.fwsc
