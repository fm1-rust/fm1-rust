name: fm1-assets

on:
  pull_request:
    paths: &fm1-assets-paths
      - 'fm1-assets/**'
      - fm1/runtime/fm1.ld
      - Cargo.toml
      - Cargo.lock
      - '.cargo/**'
      - .github/scripts/build-llvm.sh
      - .github/scripts/build-rustc.sh
      - .github/workflows/fm1-assets.yml
      - .github/workflows/pi32v2-build.yml
  push:
    branches: [main]
    paths: *fm1-assets-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # same runtime as v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --no-self-update
      - run: cargo +stable test -p fm1-assets --all-features --locked

  assets-layout:
    uses: ./.github/workflows/pi32v2-build.yml
    with:
      script: fm1-assets/tests/flash_layout.py
