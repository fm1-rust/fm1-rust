[package]
name = "fm1-rticx"
version = "0.1.1"
edition = "2024"
description = "RTICX application support for the M-VAVE FM-1"
license = "MIT"
repository = "https://github.com/fm1-rust/fm1-rust"
keywords = ["fm1", "pi32v2", "rticx"]
categories = ["embedded", "hardware-support", "no-std"]

[dependencies]
critical-section = "1"
fm1 = "0.1.3"
rtic-time = "3"
rticx-pi32v2 = "0.1.2"
rticx-pi32v2-macro = "0.1.1"
rtt-target = { version = "0.6.2", optional = true }

[dev-dependencies]
fm1-audio = "0.1"
fm1-controls = "0.1.1"
fm1-graphics = { version = "0.1", features = ["async-display"] }
futures-util = { version = "0.3", default-features = false }
static_cell = "2.1.1"

[features]
async-display = ["fm1/async-display"]
async-usb = ["fm1/async-usb"]
audio = ["fm1/audio"]
embedded-graphics = ["fm1/embedded-graphics"]
rtt = ["dep:rtt-target"]
usb-log = ["fm1/usb-log"]

[[example]]
name = "rticx-piano"
required-features = ["audio", "async-usb"]
test = true

[[example]]
name = "rticx-tone"
required-features = ["audio"]

[[example]]
name = "usb-log"
required-features = ["usb-log", "rtt"]

[[example]]
name = "rticx-waveform"
required-features = ["audio"]
test = true

[[example]]
name = "rticx-timing"
required-features = ["audio", "async-usb", "usb-log"]
test = true

[target.'cfg(not(target_os = "none"))'.dev-dependencies]
critical-section = { version = "1", features = ["std"] }

[lints]
workspace = true
