[package]
name = "fm1-rticx"
version = "0.0.0"
edition = "2024"
description = "RTICX application support for the M-VAVE FM-1"
license = "MIT"
repository = "https://github.com/fm1-rust/fm1-rust"
keywords = ["fm1", "pi32v2", "rticx"]
categories = ["embedded", "hardware-support", "no-std"]

[features]
async-display = ["fm1/async-display"]
audio = ["fm1/audio"]
embedded-graphics = ["fm1/embedded-graphics"]

[[example]]
name = "rticx-piano"
required-features = ["audio"]
test = true

[[example]]
name = "rticx-tone"
required-features = ["audio"]

[[example]]
name = "rticx-waveform"
required-features = ["audio"]
test = true

[dependencies]
critical-section = "1"
fm1 = { version = "0.1.1", path = "../fm1" }
rtic-time = "3"
rticx-pi32v2 = { version = "0.1", path = "../rticx-pi32v2" }
rticx-pi32v2-macro = { version = "0.1", path = "../rticx-pi32v2-macro" }

[dev-dependencies]
fm1-audio = { version = "0.1", path = "../fm1-audio" }
fm1-controls = { version = "0.1", path = "../fm1-controls" }
fm1-graphics = { version = "0.1", path = "../fm1-graphics", features = ["async-display"] }
static_cell = "2.1.1"
# The bytecode engine and monosynth are developed together and are not yet released.
wavegraph = { git = "https://github.com/fm1-rust/wavegraph", rev = "6e4425cd1542b45dd86e460274a771cee29dc55d" }
wavegraph-monosynth = { git = "https://github.com/fm1-rust/wavegraph", rev = "6e4425cd1542b45dd86e460274a771cee29dc55d" }

[target.'cfg(not(target_os = "none"))'.dev-dependencies]
critical-section = { version = "1", features = ["std"] }

[lints]
workspace = true
