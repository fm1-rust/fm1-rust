[package]
name = "fm1-rticx"
version = "0.2.0"
edition = "2024"
description = "RTICX application support for the M-VAVE FM-1"
license = "MIT"
repository = "https://github.com/fm1-rust/fm1-rust"
keywords = ["fm1", "pi32v2", "rticx"]
categories = ["embedded", "hardware-support", "no-std"]

[dependencies]
critical-section = "1"
fm1.workspace = true
rtic-time = "3"
static_cell = "2.1.1"
rticx-pi32v2.workspace = true
rtt-target = { version = "0.6.2", optional = true }

[dev-dependencies]
heapless = "0.9.4"
fm1-audio.workspace = true
fm1-controls.workspace = true
fm1-graphics = { workspace = true, features = ["async-display"] }
futures-util = { version = "0.3", default-features = false }

[features]
async-display = ["fm1/async-display"]
async-usb = ["fm1/async-usb"]
audio = ["fm1/audio"]
cpu1-probe = ["fm1/cpu1-probe"]
embedded-graphics = ["fm1/embedded-graphics"]
rtt = ["dep:rtt-target"]
usb-log = ["fm1/usb-log"]
usb-dma-probe = ["fm1/usb-dma-probe"]
usb-dma-stress = ["usb-dma-probe", "fm1/usb-dma-stress"]

[[example]]
name = "rticx-cpu1-audio"
required-features = ["audio", "cpu1-probe", "async-usb", "usb-log"]
test = true

[[example]]
name = "rticx-piano"
required-features = ["audio", "async-usb"]
test = true

[[example]]
name = "rticx-tone"
required-features = ["audio"]

[[example]]
name = "usb-log"
required-features = ["usb-log", "rtt"]

[[example]]
name = "rticx-waveform"
required-features = ["audio"]
test = true

[[example]]
name = "rticx-timing"
required-features = ["audio", "async-usb", "usb-log"]
test = true

[target.'cfg(not(target_os = "none"))'.dev-dependencies]
critical-section = { version = "1", features = ["std"] }

[lints]
workspace = true
