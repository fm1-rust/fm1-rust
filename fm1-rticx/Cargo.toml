[package]
name = "fm1-rticx"
version = "0.0.0"
edition = "2024"
description = "RTICX application support for the M-VAVE FM-1"
license = "MIT"
repository = "https://github.com/fm1-rust/fm1-rust"

[features]
audio = ["fm1/audio"]

[[example]]
name = "rticx-tone"
required-features = ["audio"]

[dependencies]
fm1 = { version = "0.1.0", path = "../fm1" }
rtic-time = "3"
rticx-pi32v2 = { version = "0.0.0", path = "../rticx-pi32v2" }
rticx-pi32v2-macro = { version = "0.0.0", path = "../rticx-pi32v2/rticx-macro" }

[lints]
workspace = true
