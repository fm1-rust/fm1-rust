[package]
name = "fm1"
description = "Board support for the M-VAVE FM-1 using embedded-hal"
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/fm1-rust/fm1-rust"
keywords = ["embedded-hal", "fm1", "pi32v2"]
categories = ["embedded", "hardware-support", "no-std"]

[dependencies]
embedded-hal = "1"
embedded-hal-nb = "1"

# optional dependencies
critical-section = { version = "1", optional = true }
embedded-graphics = { version = "0.8.2", optional = true }
embedded-hal-async = { version = "1", optional = true }
embedded-io = { version = "0.7", optional = true }
heapless = { version = "0.9.4", optional = true }
midly = { version = "0.5.3", default-features = false, optional = true }
mipidsi = { version = "0.10", optional = true }
oxstack-gfx = { version = "0.2.1", optional = true }

[target.'cfg(not(target_os = "none"))'.dev-dependencies]
critical-section = { version = "1", features = ["std"] }

[features]
async-display = ["dep:critical-section", "dep:embedded-hal-async"]
async-usb = ["dep:critical-section", "dep:embedded-hal-async"]
audio = []
cpu1-probe = []
flash-storage = []
embedded-graphics = ["dep:embedded-graphics", "dep:mipidsi", "dep:oxstack-gfx"]
usb-log = ["dep:heapless"]
usb-dma-probe = []
usb-midi-copy = []
usb-dma-stress = ["usb-dma-probe"]
usb-window-probe = ["usb-dma-probe"]

[[example]]
name = "flash-store"
required-features = ["flash-storage", "embedded-graphics"]

[[example]]
name = "flash-store-cpu1"
required-features = ["flash-storage", "embedded-graphics", "cpu1-probe"]

[[example]]
name = "usb-window"
required-features = ["usb-window-probe", "embedded-graphics"]

[[example]]
name = "cpu1-probe"
required-features = ["cpu1-probe"]

[[example]]
name = "graphics"
required-features = ["embedded-graphics"]

[[example]]
name = "tone"
required-features = ["audio"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
