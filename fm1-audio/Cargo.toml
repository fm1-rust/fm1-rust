[package]
name = "fm1-audio"
version = "0.1.0"
edition = "2024"
description = "Allocation-free stereo output and mixing for the M-VAVE FM-1"
license = "MIT"
repository = "https://github.com/fm1-rust/fm1-rust"
keywords = ["fm1", "audio", "pcm"]
categories = ["embedded", "multimedia::audio", "no-std"]

[dependencies]
fm1 = { path = "../fm1", features = ["audio"] }
wavegraph-sample = { version = "0.1", default-features = false }

[lints]
workspace = true
